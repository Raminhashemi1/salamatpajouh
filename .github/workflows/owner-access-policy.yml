name: Owner access policy tests
on:
  pull_request:
    paths:
      - "security/**"
      - ".github/workflows/owner-access-policy.yml"
  push:
    branches:
      - "feature/owner-controlled-access"
    paths:
      - "security/**"
      - ".github/workflows/owner-access-policy.yml"
permissions:
  contents: read
jobs:
  test-access-policy:
    name: Node.js authorization tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run owner/partner access tests
        run: node --test security/access-policy.test.mjs
